# /etc/samba/smb.conf — Samba EPA
[global]
   workgroup = WORKGROUP
   server string = Servidor EPA (%h)
   netbios name = SRV-EPA
   security = user
   map to guest = bad user
   dns proxy = no
   hosts allow = 192.168.101. 10.207.235. 127.
   log file = /var/log/samba/log.%m
   max log size = 1000

[epa]
   comment = Carpeta compartida EPA
   path = /srv/samba/epa
   browseable = yes
   read only = no
   writable = yes
   guest ok = no
   valid users = @sambashare
   create mask = 0660
   directory mask = 0770
   force group = sambashare

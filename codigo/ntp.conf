# /etc/ntpsec/ntp.conf — Servidor NTP EPA (Ubuntu 24.04 usa ntpsec)
driftfile /var/lib/ntpsec/ntp.drift

# Pools de Colombia
pool 0.co.pool.ntp.org iburst
pool 1.co.pool.ntp.org iburst
pool 2.south-america.pool.ntp.org iburst

# Restricciones por defecto: no permitir control remoto
restrict -4 default kod notrap nomodify nopeer noquery limited
restrict -6 default kod notrap nomodify nopeer noquery limited

# Localhost sin restricción
restrict 127.0.0.1
restrict ::1

# Permitir que la red local de EPA sincronice (no modifique)
restrict 192.168.101.0 mask 255.255.255.0 nomodify notrap
